[package]
name = "heic-converter"
version = "0.2.1"
description = "Bulk HEIC → JPG converter for macOS and Windows"
authors = ["youyun"]
edition = "2021"

[lib]
name = "heic_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
parking_lot = "0.12"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-process = "2"

# Windows ships an in-process libheif (HEVC) via vcpkg static-md — no PATH / Store extras.
[target.'cfg(windows)'.dependencies]
libheif-rs = { version = "2.5", default-features = false, features = ["v1_17"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Ensure cargo-vcpkg / docs pick HEVC (libde265), not AVIF-only.
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
tag = "2026.07.29"
dependencies = ["libheif[hevc]"]

[package.metadata.vcpkg.target.x86_64-pc-windows-msvc]
triplet = "x64-windows-static-md"
dependencies = ["libheif[hevc]"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
