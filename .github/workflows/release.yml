name: Release

# Builds installers via Tauri on GitHub-hosted runners and attaches them
# to a GitHub Release. Prefer Releases over committing large binaries.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.1). Leave empty to build artifacts only without a Release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # macOS convert uses Apple sips (no Homebrew needed at runtime).
      # Optional brew libheif is only useful for local PATH heif-dec smoke — skip in CI.

      - name: Install libheif via vcpkg (Windows, static HEVC)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $Vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $Vcpkg) { throw "VCPKG_INSTALLATION_ROOT not set on runner" }
          # Static libs + dynamic CRT (/MD) — matches Rust MSVC and embeds decode into the exe.
          & "$Vcpkg\vcpkg.exe" install "libheif[hevc]:x64-windows-static-md" --clean-after-build
          "VCPKG_ROOT=$Vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (upload to Release when a tag is set)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # VCPKG_ROOT / VCPKGRS_TRIPLET come from the Windows step via GITHUB_ENV.
        with:
          # Empty tagName → build only (workflow_dispatch without tag).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
          releaseName: "HEIC Converter ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}"
          releaseBody: |
            HEIC Converter installers (decoder bundled — no PATH setup).

            **Windows:** download the `.msi` or NSIS `.exe`. HEIC decode is **built into the app** (libheif + libde265 via vcpkg) — no Homebrew, no Microsoft Store HEIF extensions required.

            **macOS:** download the `.dmg` for your CPU (Apple Silicon vs Intel). Conversion uses built-in Apple `sips` (ImageIO) — no Homebrew.

            **Drag-and-drop:** drop a HEIC onto the window; the app asks whether to open the parent folder for bulk select/convert.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
