name: Release

# Builds installers via Tauri on GitHub-hosted runners and attaches them
# to a GitHub Release. Prefer Releases over committing large binaries.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0). Leave empty to build artifacts only without a Release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install libheif (macOS — provides heif-dec for local smoke)
        if: matrix.platform == 'macos-latest'
        run: brew install libheif

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (upload to Release when a tag is set)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty tagName → build only (workflow_dispatch without tag).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
          releaseName: "HEIC Converter ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}"
          releaseBody: |
            HEIC Converter installers.

            **Windows:** download the `.msi` or NSIS `.exe` asset below.
            Runtime note: install [libheif](https://github.com/strukturag/libheif) so `heif-dec` is on PATH (or use Microsoft HEIF Image Extensions if you change decoders later).

            **macOS:** download the `.dmg` for your CPU (Apple Silicon vs Intel).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
